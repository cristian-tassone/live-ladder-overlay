<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FF5068"/>
      <stop offset="0.45" stop-color="#F5223F"/>
      <stop offset="1" stop-color="#AE0A2B"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#FFC9D2" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFC9D2" stop-opacity="0"/>
    </radialGradient>

    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#5A0014" flood-opacity="0.42"/>
    </filter>

    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>

    <!-- ladder rows, with the live pip riding on the leading row -->
    <g filter="url(#drop)">
      <rect x="94" y="316" width="286" height="50" rx="25" fill="#ffffff" opacity="0.44"/>
      <rect x="94" y="238" width="286" height="50" rx="25" fill="#ffffff" opacity="0.70"/>
      <rect x="94" y="160" width="286" height="50" rx="25" fill="#ffffff"/>

      <!-- live pip -->
      <circle cx="410" cy="185" r="46" fill="#ffffff"/>
      <circle cx="410" cy="185" r="18" fill="#DA0F31"/>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" ry="114.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
</svg>
